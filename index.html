<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        .game {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            width: 502px;
            margin: 30px auto;
        }

        .sidebar {
            width: 170px;
            flex-shrink: 0;
            text-align: left;
        }

        .title {
            margin: 0 0 20px;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        .board {
            width: 300px;
            height: 540px;
            margin: 20px auto;
            background: #111;
            border: 2px solid white;

            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(18, 1fr);
            gap: 1px;
        }

        .cell {
            background: #222;
        }

        .cell.filled {
            background: #ffb366;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .levels {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .levels .button {
            padding: 8px 10px;
        }
        .cell.blocked {
            background: #888;
        }

        .play-button {
            background: #ffb366;
            color: #171717;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
        }
        .button { border-radius: 7px; }
        .button:hover:not(:disabled) { filter: brightness(1.12); }
        .button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
        .button:disabled { opacity: .45; cursor: default; }
        .levels .selected { background: #ffb366; color: #171717; }
        #level-guide { min-height: 64px; font-size: 14px; line-height: 1.5; }
        .info p { margin: 0 0 12px; }

        .cell.magic { position: relative; box-shadow: inset 0 0 0 2px #dc8bff; }
        .cell.magic::after {
            content: "★";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #ecacff;
            background: #a938d133;
            font-size: 19px;
            pointer-events: none;
        }
        @media (max-width: 540px) {
            .game { width: 100%; gap: 12px; padding: 12px; margin: 0 auto; box-sizing: border-box; }
            .sidebar { width: 140px; }
            .board { width: calc(100vw - 180px); height: calc((100vw - 180px) * 1.8); flex-shrink: 0; }
            .levels .button { padding: 8px 3px; font-size: 11px; }
        }


        .cell.reverse { position: relative; box-shadow: inset 0 0 0 2px #5ee7ef; }
        .cell.reverse::after {
            content: "?";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #8ff8ff;
            background: #1bafba33;
            font-size: 21px;
            font-weight: bold;
            pointer-events: none;
        }


        .cell.mirror-warning {
            box-shadow: inset 0 3px #66bb6a, inset 0 -3px #66bb6a;
        }


        .board.two-way { position: relative; }
        .board.two-way::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 2px solid #aaa;
            transform: translateY(-1px);
            pointer-events: none;
        }


        .cell.matching { box-shadow: inset 0 0 0 2px #eee; }


        .auto-mode { width: 100%; margin-bottom: 8px; padding: 10px 6px; }
        .auto-mode.selected { background: #ffb366; color: #171717; }
    </style>
</head>
<body>
    <main class="game">
        <div class="sidebar">
            <h1 class="title">TETRIS</h1>
            <div class="info">
                <p>Điểm: <span class="score">0</span></p>
                <p>Màn: <span class="level">1</span></p>
            </div>
            <button class="button auto-mode" id="auto" aria-pressed="false">AUTO · 500 điểm/màn</button>
            <div class="levels" aria-label="chọn màn chơi">
                <button class="button" data-level="1">1 · Bình thường</button>
                <button class="button" data-level="2">2 · Ô chặn</button>
                <button class="button" data-level="3">3 · Phép màu</button>
                <button class="button" data-level="4">4 · Dịch ô</button>
                <button class="button" data-level="5">5 · Hai chiều</button>
                <button class="button" data-level="6">6 · Ăn màu</button>
            </div>
            <p id="level-guide"></p>
            <div class="buttons">
                <button class="button play-button" id="start">▶ CHƠI</button>
                <button class="button" id="restart">Chơi lại</button>
                <button class="button" id="exit">Thoát</button>
            </div>
        </div>
        <div class="board" aria-label="bàn chơi tetris"></div>
    </main>
    <script src="game.js"></script>
</body>
</html>
